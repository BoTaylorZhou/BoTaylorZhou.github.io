<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <a class="site-brand" href="/#top" aria-label="Bo Zhou homepage">
          <span class="site-brand__mark">BZ</span>
          <span class="site-brand__text"><strong>Bo Zhou</strong><small>Rational Inattention</small></span>
        </a>
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item mobile-nav-item">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</div>
